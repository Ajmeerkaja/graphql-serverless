name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Backend - install and typecheck
        working-directory: backend/lambda
        run: |
          npm ci
          npm run typecheck

      - name: Backend - validate SAM template
        working-directory: backend/lambda
        run: sam validate --lint --region ${{ env.AWS_REGION }}

      - name: Frontend - install, lint and build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Debug OIDC claims
        run: |
          python3 - << 'EOF'
          import os, json, base64, urllib.request
          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]})
          token = json.load(urllib.request.urlopen(req))["value"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print({k: claims.get(k) for k in ("sub", "aud", "repository", "ref")})
          EOF

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          retry-max-attempts: 10

      - name: Install esbuild
        run: npm install -g esbuild

      - name: Deploy backend with SAM
        working-directory: backend/lambda
        run: |
          sam build
          sam deploy --no-confirm-changeset --no-fail-on-empty-changeset

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy frontend to S3 and CloudFront
        working-directory: frontend
        run: |
          aws s3 sync dist/ s3://${{ vars.FRONTEND_BUCKET }} --delete --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html s3://${{ vars.FRONTEND_BUCKET }}/index.html --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id ${{ vars.CLOUDFRONT_ID }} --paths "/index.html"